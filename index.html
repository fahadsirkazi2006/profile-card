<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>profile card</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="card" >
        <img src="profile.jpeg" alt="profile picture" height="200">
        <h2>Farad sarkhaji</h2>
        <p>Full stack developer in progress 🧑🏻‍💻</p>

        <div class="social">
            <a href="https://linkedin.com/in/farad-sarkhaji" ><img src="linkedin1.png" alt="" height="50"></a>
            
        </div>
        

        <p id="message">Hello there!</p>
        <button id="your-button-id">Click here</button>
        <div class="theme-button">
            <button id="darkBtn">Dark mode 🌙</button>
            <button id="lightBtn">light mode 🌞</button>
        </div>
        <p id="hidden-info" class="hidden">Looking for new projects 🚀</p>
        <button id="toggleBtn">Toggle Info</button>
    </div> 
    <script src="script.js"></script>   
</body>
</html>
